<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">EdgePulse - 边缘在线监控与服务状态</title>
  <link rel="shortcut icon" id="siteFavicon" href="/public/images/logo.svg">
  <meta name="description" content="基于 EdgeOne Makers 构建的超低延时、全球多节点 Serverless 状态监控与 Status Page 系统">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <img id="appLogo" src="/public/images/logo.svg" width="40" height="40" style="object-fit: contain; vertical-align: middle;">
        <div class="brand-info">
          <h1 id="appTitle">EdgePulse Status</h1>
          <p id="appAnnouncement">正在加载系统状态...</p>
        </div>
      </div>
      <div class="header-controls">
        <button class="refresh-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">
          <span id="themeBtnIcon"></span>
        </button>
      </div>
    </header>

    <!-- Consolidated Hero Status & Metrics Banner -->
    <section class="status-hero-card" id="statusBanner">
      <div class="hero-left">
        <div class="status-pulse-dot operational" id="statusDot"></div>
        <div class="hero-status-info">
          <h2 id="overallStatusText">所有系统与服务运行正常</h2>
          <p id="lastCheckTime">最后更新: 刚刚</p>
        </div>
      </div>

      <div class="hero-right-metrics">
        <div class="metric-inline-item">
          <span class="metric-inline-label">监控节点</span>
          <span class="metric-inline-value" id="totalSitesCount">-</span>
        </div>
        <div class="metric-inline-divider"></div>
        <div class="metric-inline-item">
          <span class="metric-inline-label">平均延迟</span>
          <span class="metric-inline-value" id="avgLatencyValue">- ms</span>
        </div>
        <div class="metric-inline-divider"></div>
        <div class="metric-inline-item">
          <span class="metric-inline-label">30 天可用率</span>
          <span class="metric-inline-value" id="overallSlaValue">99.98%</span>
        </div>
      </div>
    </section>

    <!-- Main Service List Section -->
    <main id="serviceListContainer">
      <!-- Dynamic Service Cards Rendered by JS -->
    </main>

    <!-- Footer -->
    <footer>
      <p>
        <span>Powered by <svg width="13" height="13" viewBox="0 0 24 24" fill="var(--color-accent)" style="vertical-align: -0.15em; margin: 0 1px;"><path d="M13 2L3 14h7v8l10-12h-7z"/></svg> <strong>EdgePulse</strong> on <a href="https://cloud.tencent.com/document/product/1552/127365" target="_blank" rel="noopener">Tencent EdgeOne Makers</a></span>
        <span id="icpContainer" style="display: none;">
          <span style="margin: 0 0.5rem; opacity: 0.3;">|</span>
          <a id="icpText" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color: var(--text-secondary); text-decoration: none;"></a>
        </span>
        <span style="margin: 0 0.5rem; opacity: 0.3;">|</span>
        <span id="footerRefreshBtn" onclick="manualRefresh()" style="cursor: pointer; color: var(--text-secondary); transition: color 0.2s; display: inline-flex; align-items: center; gap: 0.3rem;" onmouseover="this.style.color='var(--color-accent)'" onmouseout="this.style.color='var(--text-secondary)'" title="点击立即刷新">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -0.15em;"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg> <span id="countdownText" style="display: inline-block; min-width: 84px; text-align: left; font-variant-numeric: tabular-nums;">刷新 (30s)</span>
        </span>
      </p>
    </footer>
  </div>

  <script src="index.js"></script>
</body>
</html>
