<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdgePulse - 边缘在线监控与服务状态</title>
  <meta name="description" content="基于 EdgeOne Makers 构建的超低延时、全球多节点 Serverless 状态监控与 Status Page 系统">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-logo" id="appLogo">⚡</div>
        <div class="brand-info">
          <h1 id="appTitle">EdgePulse Status</h1>
          <p id="appAnnouncement">正在加载系统状态...</p>
        </div>
      </div>
      <div class="header-controls">
        <button class="refresh-btn" id="refreshBtn" onclick="fetchStatus()">
          <span>🔄 刷新</span>
          <span id="countdownText">(30s)</span>
        </button>
        <button class="refresh-btn" id="adminBtn" onclick="openAdminModal()">
          <span>⚙️ 管理监控</span>
        </button>
      </div>
    </header>

    <!-- System Banner -->
    <section class="status-banner" id="statusBanner">
      <div class="banner-status-indicator">
        <div class="status-pulse-dot operational" id="statusDot"></div>
        <div class="banner-text">
          <h2 id="overallStatusText">系统所有服务运行正常 (All Systems Operational)</h2>
          <p id="lastCheckTime" style="color: var(--text-muted); font-size: 0.85rem;">最后更新: 刚刚</p>
        </div>
      </div>
    </section>

    <!-- Metrics Cards Grid -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">监控节点数</div>
        <div class="metric-value" id="totalSitesCount">-</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">平均响应延迟</div>
        <div class="metric-value" id="avgLatencyValue">- ms</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">30 天平均 SLA 可用率</div>
        <div class="metric-value" id="overallSlaValue">99.98%</div>
      </div>
    </div>

    <!-- Main Service List Section -->
    <main id="serviceListContainer">
      <!-- Dynamic Service Cards Rendered by JS -->
    </main>

    <!-- Admin Modal -->
    <div class="modal-overlay" id="adminModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>⚙️ 管理与添加监控节点</h3>
          <button class="close-btn" onclick="closeAdminModal()">✕</button>
        </div>
        <form id="addSiteForm" onsubmit="handleSaveSite(event)">
          <div class="form-group">
            <label>监控类型 (Type)</label>
            <select id="siteType" onchange="toggleSiteFormFields()">
              <option value="http">HTTP(S) 网站 / API (默认 HEAD/GET)</option>
              <option value="icmp">ICMP PING 探针 (屏蔽端口 VPS)</option>
              <option value="tcp">TCP 端口检测 (如 22, 3306, 6379)</option>
              <option value="domain">域名到期到期监控 (WHOIS/RDAP)</option>
              <option value="push">Push 被动心跳打卡 (Dead Man)</option>
            </select>
          </div>

          <div class="form-group">
            <label>节点名称 (Name)</label>
            <input type="text" id="siteName" placeholder="例如: 我的主站 / 香港 VPS" required>
          </div>

          <div class="form-group" id="urlGroup">
            <label>目标 URL / 网址</label>
            <input type="url" id="siteUrl" placeholder="https://example.com">
          </div>

          <div class="form-group" id="hostGroup" style="display: none;">
            <label>目标 IP / 主机名 (Host)</label>
            <input type="text" id="siteHost" placeholder="例如: 1.2.3.4 或 db.example.com">
          </div>

          <div class="form-group" id="domainGroup" style="display: none;">
            <label>域名 (Domain)</label>
            <input type="text" id="siteDomain" placeholder="例如: eallion.com">
          </div>

          <div class="form-group">
            <label>分组名称 (Group)</label>
            <input type="text" id="siteGroup" placeholder="例如: 核心服务 / 服务器节点" value="默认分组">
          </div>

          <div class="form-group">
            <label>管理秘钥 (Admin Key)</label>
            <input type="password" id="adminKey" placeholder="默认秘钥: edgepulse-secret-key" required>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeAdminModal()">取消</button>
            <button type="submit" class="btn-primary">保存监控节点</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <p>Powered by ⚡ <strong>EdgePulse</strong> on <a href="https://cloud.tencent.com/document/product/1552/127365" target="_blank" rel="noopener">Tencent EdgeOne Makers</a></p>
    </footer>
  </div>

  <script src="index.js"></script>
</body>
</html>
